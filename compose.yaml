services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqualicious_pg
      POSTGRES_USER: aqualicious
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqualicious -d aqualicious_pg"]
      interval: 10s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8088
      DATABASE_URL: "postgresql://aqualicious:${DB_PASSWORD}@database:5432/aqualicious_pg?schema=public"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,https://localhost,capacitor://localhost}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-aqualicious-pos}"
      CLUSTER_ID: "aqualicious-cluster-primary"
      TIMEZONE: "Asia/Manila"
      GCASH_QR_URL: "${GCASH_QR_URL:-}"
      MAYA_QR_URL: "${MAYA_QR_URL:-}"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
